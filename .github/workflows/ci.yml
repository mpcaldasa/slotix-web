name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node scripts/check-action-pins.mjs
      - run: npm run contract:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Serve the built application with production security headers
        run: |
          docker build -t slotix-web:ci .
          docker run -d --name slotix-security-web --add-host reservation-core:host-gateway -p 127.0.0.1:4280:8080 slotix-web:ci
      - run: npx playwright test --config playwright.security.config.ts
      - name: Reject high and critical runtime image vulnerabilities
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          version: v0.76.1
          image-ref: slotix-web:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          timeout: 10m
      - name: Stop the production security test container
        if: always()
        run: docker stop slotix-security-web || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-diagnostics
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore
