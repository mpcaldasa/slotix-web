log_format slotix_safe '$remote_addr - $request_method $uri $server_protocol $status';
access_log /var/log/nginx/access.log slotix_safe;
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 32k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; require-trusted-types-for 'script'; trusted-types angular angular#bundler" always;
  location /api/ {
    proxy_pass http://reservation-core:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_hide_header X-Powered-By;
  }
  location = /config.json {
    expires -1;
    try_files $uri =404;
  }
  location ~* \.(?:js|css|woff2?|ico)$ {
    expires 1y;
    try_files $uri =404;
  }
  location / {
    expires -1;
    sub_filter_once off;
    sub_filter 'SLOTIX_CSP_NONCE' '$request_id';
    try_files $uri $uri/ /index.html;
  }
}
